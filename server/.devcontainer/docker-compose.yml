services:
  # -- Dev Go Environment --
  api:
    image: golang:1.27-bookworm
    container_name: server_dev_api
    volumes:
      - ..:/workspace:cached
      - ../../web:/web:cached

    command: sleep infinity

    environment:
      - WEB_DIR=/web
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=mydatabase
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/mydatabase?sslmode=disable
      - MODERATION_LLM_BASEURL=http://llm:8080
    depends_on:
      db:
        condition: service_started
      llm:
        condition: service_healthy

  # -- Moderation's Classifier Service --
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-v1.1.0
    container_name: server_dev_llm
    volumes:
      - ../models:/models:ro
    command:
      - "-m"
      - "/models/Qwen3Guard-Gen-0.6B.Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--jinja"
      - "-c"
      - "2048"
      - "-t"
      - "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # -- Database Services --
  db:
    image: postgres:16-alpine
    container_name: server_dev_db
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdevdata:/var/lib/postgresql/data
  
  migrate:
    image: migrate/migrate:v4.15.2
    container_name: server_dev_migrate
    entrypoint: ["migrate", "-path=/migrations", "-database=postgres://myuser:mypassword@db:5432/mydatabase?sslmode=disable"]
    depends_on:
      - db
    volumes:
      - ../migrations:/migrations
    command: ["up"]
volumes:
  pgdevdata: